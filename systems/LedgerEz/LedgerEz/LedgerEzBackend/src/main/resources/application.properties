spring.application.name=LedgerEzBackend
server.port=9000

# All secrets are read from environment variables (see db.env / db.env.example).
# Nothing sensitive is hardcoded here so this file is safe to commit.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/LedgerEzDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jwt.secret=${JWT_SECRET}






