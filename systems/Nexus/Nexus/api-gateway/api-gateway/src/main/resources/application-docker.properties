# Overrides used only inside docker-compose (SPRING_PROFILES_ACTIVE=docker),
# where services are reachable by their compose service name instead of localhost.
# List-valued properties (routes) don't merge across sources in Spring's binder,
# so the whole route list is redefined here rather than partially overridden via env vars.

spring.cloud.gateway.server.webmvc.routes[0].id=order-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://order-service:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://product-service:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://inventory-service:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/inventory/**
