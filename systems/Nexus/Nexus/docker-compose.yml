services:
  # ------------------------------------------------------------
  # 1. PostgreSQL (For Order Service & Inventory Service)
  # ------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nexus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nexus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # 2. MongoDB (For Product Service)
  # ------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: nexus-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db
    networks:
      - nexus-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test -u admin -p password --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # ------------------------------------------------------------
  # 3. RabbitMQ (Event Broker)
  # ------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol port (for Java apps)
      - "15672:15672"  # Management UI (Browser)
    networks:
      - nexus-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5

  # ------------------------------------------------------------
  # 4. Order Service
  # ------------------------------------------------------------
  order-service:
    build: ./order-service/order-service
    container_name: nexus-order-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexus_db
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # 5. Product Service
  # ------------------------------------------------------------
  product-service:
    build: ./product-service/product-service
    container_name: nexus-product-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_MONGODB_URI=mongodb://admin:password@mongo:27017/product_db?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # 6. Inventory Service
  # ------------------------------------------------------------
  inventory-service:
    build: ./inventory-service/inventory-service
    container_name: nexus-inventory-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexus_db
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # 7. API Gateway
  # ------------------------------------------------------------
  api-gateway:
    build: ./api-gateway/api-gateway
    container_name: nexus-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      order-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ------------------------------------------------------------
# NETWORKS & VOLUMES
# ------------------------------------------------------------
networks:
  nexus-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: