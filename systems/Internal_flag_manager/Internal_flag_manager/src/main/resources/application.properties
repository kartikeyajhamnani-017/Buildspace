spring.application.name=Internal_flag_manager
server.port=8000

# All secrets are read from environment variables (see db.env / db.env.example).
# Nothing sensitive is hardcoded here so this file is safe to commit.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/FeatureDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
